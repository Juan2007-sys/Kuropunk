services:
  - type: web
    name: kuropunk-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://frontend-cyan-nu-86.vercel.app
